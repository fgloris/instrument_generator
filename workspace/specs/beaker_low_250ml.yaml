id: beaker_low_form_250ml
name_zh: 250 mL 低型玻璃烧杯
name_en: 250 mL low-form glass beaker
category: volumetric_glassware
material: clear borosilicate glass
nominal_volume_ml: 250

appearance:
  summary: >-
    A standard low-form laboratory beaker with a cylindrical body, slightly flared rim,
    a single clean pouring spout, flat thick base, and white volume graduations.
  required_features:
    - open top with a continuous solid rim
    - one localized pouring spout, not a full elliptical rim
    - visibly real wall thickness and a thicker flat base
    - low-form proportions approximately 88 mm tall and 74 mm outer diameter
    - white curved graduation ticks every 10 mL
    - numeric labels every 50 mL through 250 mL
    - transparent, colorless borosilicate glass
  forbidden_features:
    - handle
    - stopper
    - liquid
    - disconnected floating geometry
    - duplicated walls or obvious self-intersections

dimensions_mm:
  height: 88
  outer_diameter: 74
  approximate_wall_thickness: 2.0
  approximate_base_thickness: 4.0

render_requirements:
  minimum_views: 3
  views_should_show:
    - body proportions
    - pouring spout profile
    - rim and wall thickness
    - graduation placement and readability

acceptance_notes:
  - Geometry accuracy matters more than dramatic photorealism.
  - The capacity markings should be physically plausible relative to the inner profile.
